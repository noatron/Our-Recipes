<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#407076">
    <title>פרטי ארוחה – מפה לפה</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="shopping-list-state.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="inner-page-header">
            <a href="profile.html" class="inner-back" aria-label="חזרה לפרופיל">← חזרה</a>
            <h1 id="meal-detail-header-title" class="inner-title">ארוחה</h1>
        </header>

        <main class="meal-detail-main">
            <div id="meal-detail-header" style="display: none;">
                <h2 id="meal-detail-name" class="meal-detail-title"></h2>
                <p id="meal-detail-meta" class="meal-detail-meta"></p>
                <div class="meal-detail-actions">
                    <button type="button" id="meal-detail-add-recipes-btn" class="sl-btn sl-btn-primary meal-detail-add-recipes-btn" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    הוסף מתכונים לארוחה
                </button>
                    <button type="button" id="meal-detail-shopping-btn" class="sl-btn sl-btn-primary meal-detail-shopping-btn" style="display: none;">צרי רשימת קניות מהארוחה הזו</button>
                </div>
            </div>
            <div id="meal-detail-recipes" class="recipes-grid meal-detail-recipes-grid">
                <!-- recipe cards injected by JS -->
            </div>
            <p id="meal-detail-empty" class="profile-empty" style="display: none;">אין מתכונים בארוחה זו.</p>
            <p id="meal-detail-loading" class="profile-loading">טוען...</p>
            <p id="meal-detail-error" class="profile-empty" style="display: none;"></p>
        </main>
    </div>
    <script type="module" src="meal-detail.js"></script>
</body>
</html>
