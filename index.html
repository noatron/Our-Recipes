<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#407076">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="מפה לפה">
    <title>מפה לפה</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>
    <div id="app">
        <header class="main-header main-header-refactor">
            <!-- Row 1: Logo + app name, actions -->
            <div class="header-app-bar">
                <div class="header-brand">
                    <img src="logo.svg" alt="" class="header-logo">
                    <h1 class="header-app-title">מפה לפה</h1>
                </div>
                <div class="header-app-actions">
                    <div class="header-profile-wrap">
                        <button type="button" id="header-profile-btn" class="header-icon-btn header-profile-btn" aria-label="פרופיל" aria-expanded="false" aria-haspopup="true" title="פרופיל">
                            <svg class="header-profile-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
                        </button>
                        <div id="header-profile-dropdown" class="header-profile-dropdown" hidden>
                            <button type="button" id="header-dropdown-favorites" class="header-dropdown-item">מועדפים</button>
                            <button type="button" id="header-dropdown-logout" class="header-dropdown-item" style="display: none;">התנתקות</button>
                            <button type="button" id="header-dropdown-login" class="header-dropdown-item" style="display: none;">התחברות</button>
                        </div>
                    </div>
                    <span id="header-user-name" class="header-username-muted" style="display: none;"></span>
                    <button type="button" id="favoritesFilterBtn" class="header-favorites-state" style="display: none;" aria-hidden="true"></button>
                </div>
            </div>
            <!-- Row 2: Search + Surprise -->
            <div class="header-search-row">
                <input type="text" id="searchInput" class="header-search-input" placeholder="חפשי מתכון..." autocomplete="off" aria-label="חיפוש מתכונים או מצרכים">
                <button type="button" id="headerSurpriseBtn" class="header-surprise-btn">מתכון בהפתעה</button>
            </div>
            <!-- Row 3: Filter chips (single scrollable row) – תואם ל-TAG_GROUPS ב-app.js -->
            <div class="header-chips-wrap">
                <div class="header-chips" role="tablist" aria-label="סינון לפי קטגוריה">
                    <button type="button" class="header-chip active" data-tag="" role="tab" aria-selected="true">הכל</button>
                    <button type="button" class="header-chip" data-tags="בשר,דגים,פסטות,קישים ופשטידות,צמחוני" role="tab">מנות עיקריות</button>
                    <button type="button" class="header-chip" data-tag="סלטים" role="tab">סלטים</button>
                    <button type="button" class="header-chip" data-tag="תוספות" role="tab">תוספות</button>
                    <button type="button" class="header-chip" data-tag="לחם ומאפים" role="tab">לחם ומאפים</button>
                    <button type="button" class="header-chip" data-tag="רטבים וממרחים" role="tab">רטבים וממרחים</button>
                    <button type="button" class="header-chip" data-tag="מרקים" role="tab">מרקים</button>
                    <button type="button" class="header-chip" data-tags="עוגות,עוגיות,קינוחים,שוקולד" role="tab">קינוחים</button>
                    <button type="button" class="header-chip" data-tag="ארוחות בוקר" role="tab">ארוחות בוקר</button>
                    <button type="button" class="header-chip" data-tag="חטיפים" role="tab">חטיפים</button>
                    <button type="button" class="header-chip" data-tag="שתייה" role="tab">שתייה</button>
                </div>
            </div>
        </header>

        <div id="pending-approval-banner" class="pending-approval-banner" style="display: none;">
            בקשתך ממתינה לאישור. אחרי שאושרת תוכלי להוסיף מתכונים.
        </div>

        <div id="surprise-bar" class="surprise-bar" style="display: none;">
            <span class="surprise-bar-title">ההפתעה שלך</span>
            <button type="button" id="surpriseAgainBtn" class="surprise-again-btn">עוד אחת</button>
            <button type="button" id="surpriseBackBtn" class="surprise-back-btn">חזרה לרשימה</button>
        </div>

        <div id="recipes">
            <!-- Carousel (browse) or grid (search/filter) + count injected by JS -->
        </div>

        <div id="quick-access-wrap" class="quick-access-wrap" style="display: none;" aria-label="גישה מהירה">
            <a href="index.html?favorites=1" id="quick-access-favorites" class="quick-access-card">
                <span class="quick-access-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span>
                <span class="quick-access-label">מועדפים</span>
                <span class="quick-access-badge" id="quick-access-fav-count" aria-hidden="true"></span>
            </a>
            <a href="profile.html" class="quick-access-card">
                <span class="quick-access-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v6"/><path d="M8 2v6"/><path d="M12 22v-6"/><path d="M4 12h16"/><path d="M2 14h4"/><path d="M18 14h4"/><path d="M12 22c-2.5 0-4.5-2-5-4.5V12"/><path d="M12 22c2.5 0 4.5-2 5-4.5V12"/></svg></span>
                <span class="quick-access-label">ארוחות</span>
                <span class="quick-access-badge" id="quick-access-meals-count" aria-hidden="true"></span>
            </a>
            <a href="shopping-list.html" class="quick-access-card">
                <span class="quick-access-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span>
                <span class="quick-access-label">קניות</span>
                <span class="quick-access-badge" id="quick-access-sl-count" aria-hidden="true"></span>
            </a>
        </div>

        <details class="mobile-more-wrap" id="mobileMoreWrap" open>
            <summary class="mobile-more-summary"></summary>
            <p class="migrate-link-wrap">
                <a href="manage-tags.html" class="migrate-link">ניהול קטגוריות</a>
                <span class="migrate-sep">|</span>
                <a href="manage-users.html" class="migrate-link">ניהול משתמשות</a>
                <span class="migrate-sep">|</span>
                <a href="migrate-categories-to-tags.html" class="migrate-link">המרת קטגוריות ישנות</a>
            </p>
        </details>
    </div>

    <script src="shopping-list-state.js"></script>
    <script type="module" src="app.js"></script>

    <!-- Add Recipe Button -->
    <button id="add-recipe-btn" class="floating-add-btn" aria-label="הוסף מתכון">
        <span class="plus-icon">+</span>
    </button>
</body>
</html>
